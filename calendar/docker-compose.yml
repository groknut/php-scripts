version: "3.8"

services:
    # ---------- PHP-FPM (Alpine) ----------
    php:
        build: .
        # image: php:fpm-alpine
        container_name: calcu-php
        volumes:
            - ./src:/var/www/html
        networks:
            - calcu
        depends_on:
            - mysql

    # ---------- Nginx (Alpine) ----------
    nginx:
        image: nginx:alpine
        container_name: calcu-nginx
        ports:
            - "8080:80"
        volumes:
            - ./src:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - calcu

    # ---------- MySQL (Alpine) ----------
    mysql:
        image: mysql:8.0
        restart: always
        container_name: calcu-db
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: calendar
            MYSQL_USER: user
            MYSQL_PASSWORD: secret
        volumes:
            - db_data:/var/lib/mysql
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - calcu
        command: --skip-ssl --disable-ssl

volumes:
    db_data:

networks:
    calcu:
        driver: bridge
